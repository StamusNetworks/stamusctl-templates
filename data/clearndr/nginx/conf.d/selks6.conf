{{- if .Values.otel.metrics.ngx.enabled }}
server {
    listen 8081;
    server_name _;
    location /stub_status {
        stub_status;
    }
}
{{- end }}

server {
    listen 80 default_server;
    server_name SELKS;

	{{- if .Values.nginx.ssl.enabled }}
    listen 443 default_server ssl;
    ssl_certificate /etc/nginx/ssl/{{.Values.nginx.ssl.certname}};
    ssl_certificate_key /etc/nginx/ssl/{{.Values.nginx.ssl.keyname}};
    if ($scheme = 'http') {
        rewrite     ^   https://$host$request_uri? permanent;
    }
    {{- end }}

    {{- if .Values.otel.enabled }}
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log info;
    {{- else }}
    access_log /dev/stdout;
    error_log /dev/stderr info;
    {{- end }}

    # https://docs.djangoproject.com/en/dev/howto/static-files/#serving-static-files-in-production
    location /static/ { # STATIC_URL
        alias /static/; # STATIC_ROOT
        expires 30d;
    }

    location /media/ { # MEDIA_URL
        alias /static/; # MEDIA_ROOT
        expires 30d;
    }

    location /plugins/ {
        proxy_pass http://opensearch-dashboards:5601/plugins/;
        proxy_redirect off;
    }

    location /dlls/ {
        proxy_pass http://opensearch-dashboards:5601/dlls/;
        proxy_redirect off;
    }

    location /socket.io/ {
        proxy_pass http://opensearch-dashboards:5601/socket.io/;
        proxy_redirect off;
    }

    location /dataset/ {
        proxy_pass http://opensearch-dashboards:5601/dataset/;
        proxy_redirect off;
    }

    location /translations/ {
        proxy_pass http://opensearch-dashboards:5601/translations/;
        proxy_redirect off;
    }

    location ^~ /built_assets/ {
        proxy_pass http://opensearch-dashboards:5601/built_assets/;
        proxy_redirect off;
    }

    location /ui/ {
        proxy_pass http://opensearch-dashboards:5601/ui/;
        proxy_redirect off;
    }

   location /spaces/ {
        proxy_pass http://opensearch-dashboards:5601/spaces/;
        proxy_redirect off;
    }

    location /node_modules/ {
        proxy_pass http://opensearch-dashboards:5601/node_modules/;
        proxy_redirect off;
    }

    location /bootstrap.js {
        proxy_pass http://opensearch-dashboards:5601/bootstrap.js;
        proxy_redirect off;
    }

    location /startup.js {
        proxy_pass http://opensearch-dashboards:5601/startup.js;
        proxy_redirect off;
    }

    location /internal/ {
        proxy_pass http://opensearch-dashboards:5601/internal/;
        proxy_redirect off;
    }

    location /7885/ {
        proxy_pass http://opensearch-dashboards:5601/7885/;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ "^/([\d]{4,5}/.*)" {
        proxy_pass http://opensearch-dashboards:5601/$1;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    proxy_ssl_server_name on;
    proxy_ssl_name $proxy_host;

{{- if not .Values.globals.proxy.enabled }}
    location /blog/tag/clear-ndr-community/rss.xml {
        proxy_set_header Host "www.stamus-networks.com";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass https://www.stamus-networks.com/blog/tag/clear-ndr-community/rss.xml;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /blog/tag/clear-ndr-enterprise/rss.xml {
        proxy_set_header Host "www.stamus-networks.com";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass https://www.stamus-networks.com/blog/tag/clear-ndr-enterprise/rss.xml;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
{{- else }}
    location /blog/tag/clear-ndr-community/rss.xml {
        return 503 "RSS feed unavailable when proxy is enabled";
        add_header Content-Type text/plain;
    }

    location /blog/tag/clear-ndr-enterprise/rss.xml {
        return 503 "RSS feed unavailable when proxy is enabled";
        add_header Content-Type text/plain;
    }
{{- end }}

    {{- if .Values.scout }}
    location /scout/ {
        proxy_pass http://scout:80/;
        proxy_read_timeout 600;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /scout;
        proxy_redirect off;
    }
    {{- end }}

    {{- if .Values.grafana.enabled }}
    location = /grafana-auth-check {
        internal;
        proxy_pass http://scirius:8000/rest/rules/system_settings/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $http_host;
    }

    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        auth_request /grafana-auth-check;
        auth_request_set $auth_status $upstream_status;
        error_page 401 403 = /accounts/login/?next=$request_uri;

        proxy_pass http://grafana:3000/grafana/;
        proxy_read_timeout 600;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /grafana/api/live/ {
        auth_request /grafana-auth-check;

        proxy_pass http://grafana:3000/grafana/api/live/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
    }
    {{- end }}

 location / {
       proxy_pass http://scirius:8000;
       proxy_read_timeout 600;
       proxy_set_header Host $http_host;
       proxy_set_header X-Forwarded-Proto https;
       proxy_redirect off;
       client_max_body_size 100M;
    }

}
