aichat:
  enabled:
    type: bool
    usage: Enable AI Chat (LibreChat) functionality
    default: false
  openai_api_key:
    type: string
    usage: OpenAI API key for GPT-4/GPT-4o models
    default: ""
  anthropic_api_key:
    type: string
    usage: Anthropic API key for Claude models
    default: ""
  google_api_key:
    type: string
    usage: Google API key for Gemini models
    default: ""
  local_llm_url:
    type: string
    usage: Local LLM API URL (OpenAI-compatible endpoint, e.g. llama.cpp, LocalAI, vLLM)
    default: ""
  remote_llm_url:
    type: string
    usage: Remote LLM API base URL (OpenAI-compatible, e.g. Azure OpenAI, private vLLM)
    default: ""
  remote_llm_api_key:
    type: string
    usage: API key for the remote LLM endpoint
    default: ""
  remote_llm_name:
    type: string
    usage: Display name for the remote LLM endpoint
    default: ""
  default_user_email:
    type: string
    usage: Default user email (auto-created on first start)
    default: "admin@clearndr.local"
  default_user_password:
    type: string
    usage: Default user password (minimum 8 characters)
    default: "clearndr"
  default_user_name:
    type: string
    usage: Default user display name
    default: "Admin"
