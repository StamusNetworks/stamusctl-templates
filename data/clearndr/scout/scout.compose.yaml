{{- if (.Values.scout) }}
configs:
    scout-config:
        file: scout-config.json

services:
    scout:
        image: {{ printf "%s:%s" (.Values.scout.registry | default "ghcr.io/stamusnetworks/scout") (.Values.scout.version | default "1.0.0") }}
        container_name: {{template "base-name" .}}-scout-{{ .Release.seed }}
        restart: {{ .Values.globals.restartmode | default "unless-stopped" }}
        configs:
            - source: scout-config
              target: /usr/share/nginx/html/config.json
        {{- if .Values.otel.enabled }}
        volumes:
            - {{ .Release.location }}/containers-data/scout/logs:/var/log/nginx
        {{- end }}
        {{- if or .Values.global.exposePorts (.Values.scout).openPort }}
        ports:
            - {{ (.Values.scout).port | default "8080" }}:80
        {{- end }}
        networks:
            network:
{{- end }}
