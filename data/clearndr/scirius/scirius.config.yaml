scirius:
  type: optional
  usage: Enable Scirius instance ?
  default: true
  registry:
    type: string
    usage: Image registry where to find scirius image
    default: ghcr.io/stamusnetworks/scirius
  sciriusversion:
    type: string
    usage: Scirius version to install
    default: clear-ndr-1.1.2
  version:
    type: string
    usage: Scirius internal version
    default: 1.2.0
  debug:
    type: bool
    usage: Enable debug mode
    default: false
  healthcheck:
    interval:
      type: string
      usage: Healthcheck interval for Scirius
      default: "10s"
    timeout:
      type: string
      usage: Healthcheck timeout for Scirius
      default: "1s"
    retries:
      type: int
      usage: Healthcheck retries for Scirius
      default: 5
    start_period:
      type: string
      usage: Healthcheck start period for Scirius
      default: "5m"
  celery:
    type: optional
    usage: Enable Celery ?
    default: true
    flower:
      type: optional
      usage: Enable Celery flower ?
      default: false
    worker:
      type: optional
      usage: Enable Celery worker ?
      default: true
      restart:
        type: string
        usage: Celery worker restart mode
        default: unless-stopped
    beat:
      type: optional
      usage: Enable Celery beat ?
      default: true
      restart:
        type: string
        usage: Celery beat restart mode
        default: unless-stopped
    test:
      type: optional
      usage: Enable Celery flower ?
      default: false
