opensearch:
  openport:
    type: bool
    usage: Expose OpenSearch port
    default: false
  memory:
    type: string
    usage: Memory limit for OpenSearch
    default: "2g"
  datapath:
    type: string
    usage: Data path on host to store OpenSearch data
    default: "opensearch-data"
  dashboards:
    type: optional
    usage: Enable OpenSearch Dashboards
    default: true
    openport:
      type: bool
      usage: Expose OpenSearch Dashboards port
      default: true
  healthcheck:
    interval:
      type: string
      usage: Healthcheck interval for OpenSearch
      default: "10s"
    timeout:
      type: string
      usage: Healthcheck timeout for OpenSearch
      default: "5s"
    retries:
      type: int
      usage: Healthcheck retries for OpenSearch
      default: 3
    start_period:
      type: string
      usage: Healthcheck start period for OpenSearch
      default: "30s"
  dashboards_healthcheck:
    interval:
      type: string
      usage: Healthcheck interval for OpenSearch Dashboards
      default: "30s"
    timeout:
      type: string
      usage: Healthcheck timeout for OpenSearch Dashboards
      default: "5s"
    retries:
      type: int
      usage: Healthcheck retries for OpenSearch Dashboards
      default: 3
    start_period:
      type: string
      usage: Healthcheck start period for OpenSearch Dashboards
      default: "30s"
  ism:
    warm_min_index_age:
      type: string
      usage: Minimum index age before transitioning to warm state
      default: "7d"
    delete_min_index_age:
      type: string
      usage: Minimum index age before transitioning to delete state
      default: "15d"
