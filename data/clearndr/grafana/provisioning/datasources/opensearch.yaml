apiVersion: 1

datasources:
  - name: OpenSearch
    uid: opensearch-eve
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch:9200
    isDefault: true
    editable: false
    jsonData:
      database: "logstash-*"
      flavor: opensearch
      version: "3.3.1"
      timeField: "@timestamp"
      logMessageField: "message"
      logLevelField: ""
      pplEnabled: true

  - name: OpenSearch - Application Logs
    uid: opensearch-applogs
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch:9200
    editable: false
    jsonData:
      database: "applogs-*"
      flavor: opensearch
      version: "3.3.1"
      timeField: "@timestamp"
      logMessageField: "Body.value"
      logLevelField: ""
      pplEnabled: true
